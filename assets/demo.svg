<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <style>
      .card { fill:#0d1117; stroke:#30363d; }
      .t { font-size:13px; fill:#c9d1d9; }
      .red { fill:#ff7b72; font-weight:700; }
      .green { fill:#3fb950; }
      .dim { fill:#8b949e; }
      .blue { fill:#58a6ff; }
      .yellow { fill:#d29922; }
      .cmd { fill:#c9d1d9; font-weight:600; }
      .prompt { fill:#3fb950; font-weight:700; }
      .title { fill:#8b949e; font-size:13px; }
    </style>
  </defs>
  <rect width="1200" height="800" fill="#010409"/>

  <!-- Card A: symptom patch caught -->
  <rect x="20" y="20" width="1160" height="430" rx="10" class="card"/>
  <rect x="20" y="20" width="1160" height="36" rx="10" fill="#161b22"/>
  <rect x="20" y="46" width="1160" height="10" fill="#161b22"/>
  <circle cx="46" cy="38" r="6" fill="#ff5f56"/><circle cx="66" cy="38" r="6" fill="#ffbd2e"/><circle cx="86" cy="38" r="6" fill="#27c93f"/>
  <text x="116" y="43" class="title">bandaid — symptom patch</text>

  <text x="50" y="82" class="t"><tspan class="prompt">$ </tspan><tspan class="cmd">bandaid --patch examples/bandaid.patch</tspan></text>
  <text x="50" y="107" class="t blue">src/checkout.py</text>
  <text x="50" y="128" class="t"><tspan class="red">  L4    BANDAID </tspan><tspan>except-pass       the exception is swallowed: the failure vanishes</tspan></text>
  <text x="50" y="149" class="t"><tspan class="red">  L9    BANDAID </tspan><tspan>guard-removed     a raise/assert was replaced by a quiet exit</tspan></text>
  <text x="50" y="170" class="t"><tspan class="red">  L15   BANDAID </tspan><tspan>bare-except       bare except catches every error, incl. the bug you fix</tspan></text>
  <text x="50" y="191" class="t"><tspan class="red">  L15   BANDAID </tspan><tspan>except-pass       the exception is swallowed: the failure vanishes</tspan></text>
  <text x="50" y="216" class="t blue">web/cart.js</text>
  <text x="50" y="237" class="t"><tspan class="red">  L5    BANDAID </tspan><tspan>guard-removed     a raise/assert was replaced by a quiet exit</tspan></text>
  <text x="50" y="258" class="t"><tspan class="red">  L6    BANDAID </tspan><tspan>empty-catch       empty catch block swallows the failure</tspan></text>
  <text x="50" y="288" class="t red">bandaid: 6 bandaids, 0 suspects across 2 files (0 suppressed by 'bandaid: allow')</text>
  <text x="50" y="309" class="t yellow">bandaid: fix the cause, or justify an intentional line with:  # bandaid: allow -- &lt;reason&gt;</text>
  <text x="50" y="340" class="t"><tspan class="prompt">$ </tspan><tspan>echo $?</tspan></text>
  <text x="50" y="361" class="t red">1</text>
  <text x="50" y="396" class="t dim">blocked: this patch hides errors instead of fixing them</text>

  <!-- Card B: root-cause fix + justified escape -->
  <rect x="20" y="470" width="1160" height="310" rx="10" class="card"/>
  <rect x="20" y="470" width="1160" height="36" rx="10" fill="#161b22"/>
  <rect x="20" y="496" width="1160" height="10" fill="#161b22"/>
  <circle cx="46" cy="488" r="6" fill="#ff5f56"/><circle cx="66" cy="488" r="6" fill="#ffbd2e"/><circle cx="86" cy="488" r="6" fill="#27c93f"/>
  <text x="116" y="493" class="title">bandaid — root-cause fix &amp; justified escape</text>

  <text x="50" y="532" class="t"><tspan class="prompt">$ </tspan><tspan class="cmd">bandaid --patch examples/real-fix.patch</tspan></text>
  <text x="50" y="557" class="t green">bandaid: clean -- scanned 12 added lines across 1 files, 0 findings</text>
  <text x="50" y="578" class="t"><tspan class="prompt">$ </tspan><tspan>echo $?</tspan></text>
  <text x="50" y="599" class="t green">0</text>
  <text x="50" y="630" class="t"><tspan class="prompt">$ </tspan><tspan class="cmd">bandaid --patch examples/allowed.patch</tspan></text>
  <text x="50" y="655" class="t green">bandaid: clean -- scanned 1 added lines across 1 files, 0 findings</text>
  <text x="50" y="676" class="t green">bandaid: 1 justified by 'bandaid: allow'</text>
  <text x="50" y="697" class="t"><tspan class="prompt">$ </tspan><tspan>echo $?</tspan></text>
  <text x="50" y="718" class="t green">0</text>
  <text x="50" y="753" class="t dim">real fixes pass; intentional shortcuts must state their reason on the line</text>
</svg>
