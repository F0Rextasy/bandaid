name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: contract tests
        run: python -m unittest discover -s tests -v
      - name: reject symptom patches on this branch
        run: |
          git fetch origin "$GITHUB_BASE_REF" || true
          if [ -n "$GITHUB_BASE_REF" ]; then
            python scripts/bandaid.py --base "origin/$GITHUB_BASE_REF" || true
          fi
